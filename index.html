      --accent:#4285ff;
      --accent-neon:#7b61ff;
      --border:#272a3d;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{

      max-width:860px;
      margin:0 auto;
    }
    .lang-bar{

      flex-wrap:wrap;
      gap:6px;
      justify-content:flex-end;
      margin-bottom:28px;
    }
    .lang-btn{
      background:var(--bg-card);
      border:1px solid var(--border);
      color:var(--text-secondary);
      padding:5px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:13px;
      transition:0.2s;
    }
    .lang-btn.active{
      border-color:var(--accent-neon);
      color:#fff;
      background:#202338;
    }
    .container{
      background:var(--bg-card);
      border-radius:14px;
      padding:28px 32px;
      border:1px solid var(--border);
    }
    h1{
      font-size:26px;
      margin-bottom:12px;
      background:linear-gradient(90deg,var(--accent),var(--accent-neon));
      -webkit-background-clip:text;
      color:transparent;
    }
    .effective-date{
      color:var(--text-secondary);
      font-size:14px;
      margin-bottom:24px;
      padding-bottom:14px;
      border-bottom:1px solid var(--border);
    }
    h2{
      font-size:18px;
      margin:28px 0 10px;
      color:#e2e6f5;
    }
    p{
      color:var(--text-secondary);
      margin:10px 0;
      text-align:justify;
    }
    ul,ol{
      padding-left:22px;
      margin:10px 0;
      color:var(--text-secondary);
    }
    li{
      margin:6px 0;
    }
    strong{
      color:#fff;
    }
    a{
      color:var(--accent);
      text-decoration:none;
    }
    a:hover{text-decoration:underline;}
    footer{
      margin-top:36px;
      padding-top:16px;
      border-top:1px solid var(--border);
      color:var(--text-secondary);
      font-size:13px;
      text-align:center;
    }
    @media(max-width:600px){
      .container{padding:20px 16px;}
      h1{font-size:22px;}
    }
  </style>

<p>본 개인정보 처리방침은 로컬 실행 앱 LumoConvert(이하 “소프트웨어”)에 적용됩니다. 본 소프트웨어는 기기 내에서 작동하며 오프라인 사용이 가능하고 소셜 기능, 커뮤니티, 콘텐츠 게시, 사용자 데이터 클라우드 저장 기능이 없습니다. 관련 법규를 준수하여 사용자 프라이버시를 보호합니다. 소프트웨어를 다운로드·설치·사용함으로써 본 방침에 동의하는 것으로 간주됩니다. 동의하지 않으시면 즉시 사용을 중단하고 앱을 제거하십시오.</p>

<p>해당 요청은 익명으로 연관되지 않으며 사용자 프로파일링, 행위 분석, 광고 목적으로 사용되지 않습니다.</p>

const langList = [
  {code:"zh-Hans",label:"简体中文"},
  {code:"zh-Hant",label:"繁體中文"},
  {code:"en-US",label:"English"},
  {code:"ja",label:"日本語"},
  {code:"ko",label:"한국어"},
  {code:"de-DE",label:"Deutsch"},
  {code:"fr-FR",label:"Français"}
];

const langBarEl = document.getElementById("langBar");
const pageEl = document.getElementById("pageContent");

langList.forEach(l=>{
  const btn = document.createElement("button");
  btn.className = "lang-btn";
  btn.dataset.lang = l.code;
  btn.textContent = l.label;
  btn.onclick = ()=>setLang(l.code);
  langBarEl.appendChild(btn);
});

function setLang(code){
  const t = i18n[code] ?? i18n["en-US"];
  document.title = t.title + " | LumoConvert";
  document.documentElement.lang = code;
  pageEl.innerHTML = `<h1>${t.title}</h1><div class="effective-date">${t.effective}</div>${t.content}`;
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === code);
  });
  localStorage.setItem("privacy_lang",code);
}

// auto‑detect
(function(){
  const saved = localStorage.getItem("privacy_lang");
  if(saved && i18n[saved]){
    setLang(saved);
    return;
  }
  const brLang = navigator.language || navigator.userLanguage;
  let match = "en-US";
  if(brLang.startsWith("zh-CN")) match="zh-Hans";
  else if(brLang.startsWith("zh-TW")||brLang.startsWith("zh-HK")) match="zh-Hant";
  else if(brLang.startsWith("ja")) match="ja";
  else if(brLang.startsWith("ko")) match="ko";
  else if(brLang.startsWith("de")) match="de-DE";
  else if(brLang.startsWith("fr")) match="fr-FR";
  setLang(match);
})();
</script>
</body>
